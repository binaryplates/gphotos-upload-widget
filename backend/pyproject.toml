[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gphotos-upload-service"
version = "1.0.0"
description = "D-Bus service backing the Photos Upload GNOME Shell extension"
requires-python = ">=3.9"

[project.scripts]
gphotos-upload-service = "gphotos_upload_service.cli:main"

[tool.setuptools]
packages = ["gphotos_upload_service"]
py-modules = ["gphotos_upload_common", "gphotos_datefix"]
